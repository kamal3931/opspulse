name: OpsPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-pipeline-and-tests:
    name: Python Pipeline & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL pipeline (twice to verify live idempotency) & Gold analytics
        run: |
          python pipeline.py
          python pipeline.py
          python analytics.py

      - name: Run pytest quality gates
        run: pytest -v test_pipeline.py

  docker-verification:
    name: Docker Build & Container Tests
    runs-on: ubuntu-latest
    needs: python-pipeline-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose config & build image
        run: |
          mkdir -p data
          docker compose config -q
          docker compose build

      - name: Execute containerized pipeline & pytest suite
        run: |
          docker compose run --rm opspulse-pipeline
          docker compose run --rm opspulse-tests